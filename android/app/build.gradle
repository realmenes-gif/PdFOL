plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meneses999.pdfol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meneses999.pdfol'
        minSdk 30          // Android 11 en adelante
        targetSdk 35
        versionCode 3
        versionName '1.2'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv('PDFOL_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PDFOL_KS_PASS')
                keyAlias 'pdfol'
                keyPassword System.getenv('PDFOL_KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('PDFOL_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    // reconocer texto en paginas escaneadas: el modelo va dentro de la app (funciona sin internet y sin Google Play)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
