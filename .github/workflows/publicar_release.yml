# GitHub Actions: arma PdFOL.exe en Windows y publica la version que detecta el actualizador.
# Se dispara al subir cambios a main: lee VERSION_INTERNA de PdFOL_v*.py y, si esa version
# todavia no esta publicada, arma el portable y el instalador y crea la version (etiqueta vX).
name: Publicar PdFOL

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  armar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver la version del programa
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $py = (Get-ChildItem PdFOL_v*.py | Select-Object -First 1).Name
          $m = Select-String -Path $py -Pattern '^VERSION_INTERNA = "([^"]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "archivo=$py" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "existe=1" >> $env:GITHUB_OUTPUT; Write-Host "v$v ya esta publicada: no se hace nada." }
          else { "existe=0" >> $env:GITHUB_OUTPUT; Write-Host "Se publica v$v." }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.existe == '0'
        with:
          python-version: "3.12"

      - name: Instalar librerias (mismas versiones que crear_portable.bat)
        if: steps.ver.outputs.existe == '0'
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<2" pikepdf pillow "customtkinter>=5.2,<6" tkinterdnd2 pyinstaller

      - name: Prueba antes de armar (inicio, ventana, paginas y salida)
        if: steps.ver.outputs.existe == '0'
        shell: pwsh
        run: |
          $py = "${{ steps.ver.outputs.archivo }}"
          python -c "import pymupdf; d = pymupdf.open(); [d.new_page().insert_text((72, 72 + 20 * i), 'Prueba PdFOL') for i in range(3)]; d.save('prueba.pdf')"
          $env:PDFOL_AUTOPRUEBA = (Resolve-Path prueba.pdf).Path
          $env:PDFOL_AUTOPRUEBA_LOG = Join-Path $PWD "autoprueba.log"
          $p = Start-Process python -ArgumentList "`"$py`" --pdfol-inicio" -PassThru -RedirectStandardInput prueba.pdf -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { $p.Kill(); Write-Error "La pantalla de inicio no termina"; exit 1 }
          $p = Start-Process python -ArgumentList "`"$py`"" -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "PdFOL no termino la prueba"; exit 1 }
          if (Test-Path autoprueba.log) { Get-Content autoprueba.log; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "PdFOL salio con codigo $($p.ExitCode)"; exit 1 }
          Write-Host "Prueba OK"

      - name: Armar PdFOL.exe
        if: steps.ver.outputs.existe == '0'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name PdFOL --icon PdFOL.ico `
            --collect-all pymupdf --collect-all pikepdf --collect-all customtkinter --collect-all tkinterdnd2 `
            --hidden-import PIL._tkinter_finder --hidden-import PIL.ImageTk --hidden-import PIL.JpegImagePlugin `
            --hidden-import PIL.PngImagePlugin --hidden-import PIL.IcoImagePlugin --hidden-import PIL.BmpImagePlugin `
            --exclude-module PIL._avif --exclude-module PIL.AvifImagePlugin `
            --add-data "fuentes;fuentes" "${{ steps.ver.outputs.archivo }}"

      - name: Comprimir y calcular SHA256
        if: steps.ver.outputs.existe == '0'
        shell: pwsh
        run: |
          Move-Item dist/PdFOL PdFOL_portable
          # v2.6: fuera lo que no se usa (arrastrar de Mac y Linux, zonas horarias de Tcl)
          $i = "PdFOL_portable/_internal"
          Get-ChildItem "$i/tkinterdnd2/tkdnd" -Directory | Where-Object { $_.Name -ne "win-x64" } | Remove-Item -Recurse -Force
          Remove-Item -Recurse -Force "$i/_tcl_data/tzdata", "$i/_tcl_data/msgs" -ErrorAction SilentlyContinue
          "{0:N1} MB" -f ((Get-ChildItem PdFOL_portable -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Copy-Item PdFOL_documento.ico PdFOL_portable\
          # prueba del .exe ya armado (si le falta una libreria, aca se nota)
          $env:PDFOL_AUTOPRUEBA = (Resolve-Path prueba.pdf).Path
          $env:PDFOL_AUTOPRUEBA_LOG = Join-Path $PWD "autoprueba_exe.log"
          $p = Start-Process PdFOL_portable\PdFOL.exe -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "PdFOL.exe no termino la prueba"; exit 1 }
          if (Test-Path autoprueba_exe.log) { Get-Content autoprueba_exe.log; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "PdFOL.exe salio con codigo $($p.ExitCode)"; exit 1 }
          Remove-Item Env:PDFOL_AUTOPRUEBA
          Get-ChildItem PdFOL_portable -Filter "PdFOL_perfiles.json*" | Remove-Item
          Compress-Archive -Path PdFOL_portable -DestinationPath PdFOL_portable.zip
          $h = (Get-FileHash PdFOL_portable.zip -Algorithm SHA256).Hash.ToLower()
          "$h  PdFOL_portable.zip" | Out-File -Encoding ascii PdFOL_portable.zip.sha256

      - name: Armar el instalador (Inno Setup)
        if: steps.ver.outputs.existe == '0'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q "/DMiVersion=${{ steps.ver.outputs.version }}" "/FPdFOL_instalador" PdFOL.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Crear la version
        if: steps.ver.outputs.existe == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PdFOL v${{ steps.ver.outputs.version }}
          body_path: NOVEDADES.md
          files: |
            PdFOL_portable.zip
            PdFOL_portable.zip.sha256
            PdFOL_instalador.exe
