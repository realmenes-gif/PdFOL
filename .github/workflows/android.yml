# GitHub Actions: arma el APK de PdFOL para Android y lo prueba en un emulador.
# Sin las claves de firma (secretos PDFOL_KEYSTORE_B64 y PDFOL_KS_PASS) arma un APK de prueba.
# Con las claves y «publicar» = si (a mano), publica la version android-vX (no toca la del PC).
name: Android PdFOL

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la version (si/no)"
        default: "no"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Version y firma
        id: ver
        env:
          KS: ${{ secrets.PDFOL_KEYSTORE_B64 }}
          PASS: ${{ secrets.PDFOL_KS_PASS }}
        run: |
          v=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          echo "version=$v" >> $GITHUB_OUTPUT
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/pdfol.jks"
            echo "PDFOL_KEYSTORE=$RUNNER_TEMP/pdfol.jks" >> $GITHUB_ENV
            echo "PDFOL_KS_PASS=$PASS" >> $GITHUB_ENV
            echo "oficial=1" >> $GITHUB_OUTPUT
          else
            echo "PDFOL_KEYSTORE=$GITHUB_WORKSPACE/android/prueba/prueba.jks" >> $GITHUB_ENV
            echo "PDFOL_KS_PASS=pdfol-prueba" >> $GITHUB_ENV
            echo "oficial=0" >> $GITHUB_OUTPUT
          fi

      - name: Armar el APK
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk "PdFOL_Android_v${{ steps.ver.outputs.version }}.apk"
          ls -la *.apk

      - name: Habilitar KVM (emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/prueba/probar.sh "PdFOL_Android_v${{ steps.ver.outputs.version }}.apk" capturas

      - name: Guardar APK y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfol-android
          path: |
            *.apk
            capturas/

      - name: Borrar la prueba anterior
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android-prueba --repo "${{ github.repository }}" --yes || true

      - name: Subir la prueba (borrador privado)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-prueba
          name: PdFOL Android (prueba)
          draft: true
          files: |
            *.apk
            capturas/*

      - name: Publicar la version
        if: contains(github.event.head_commit.message, '[publicar]') || github.event.inputs.publicar == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PdFOL Android v${{ steps.ver.outputs.version }}
          body_path: android/NOVEDADES.md
          make_latest: false
          files: "*.apk"
